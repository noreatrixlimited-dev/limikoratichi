<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import * as L from './lib.js';
const q = new URLSearchParams(location.search);
const cat = q.get('c'), id = q.get('s');
const W = 1280, H = 720;
try {
  const styles = (await import(`./styles/${cat}.js`)).default;
  if (q.has('list')) {
    window.LIST = Object.entries(styles).map(([k, v]) => ({ id: k, dim: v.dim, title: v.title }));
  } else {
    const st = styles[id];
    if (!st) throw new Error('unknown style ' + id);
    const canvas = document.getElementById('c');
    if (st.dim === '3d') {
      const THREE = await import('three');
      await st.draw({ THREE, canvas, W, H, L });
    } else {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      await L.loadFonts(); await document.fonts.ready;
      await st.draw(ctx, W, H, L);
    }
  }
  window.DONE = true;
} catch (e) {
  window.ERR = String(e && e.stack || e);
}
</script>
</body>
</html>
