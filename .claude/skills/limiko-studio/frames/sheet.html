<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1000"></canvas>
<script type="module">
import { drawSheet, drawCharacter } from './character.js';
window.render = async (spec, mode) => {
  try {
    await document.fonts.ready;
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    drawSheet(ctx, c.width, c.height, spec);
    window.DONE = true;
  } catch (e) { window.ERR = String(e && e.stack || e); }
};
window.READY = true;
</script></body></html>
