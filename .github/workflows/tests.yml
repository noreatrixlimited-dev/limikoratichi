name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .claude/skills/limiko-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core
      - name: Python packages (light: no voice or vision models)
        run: pip install numpy soundfile pillow
      - name: Renderer packages
        working-directory: .claude/skills/limiko-studio/frames
        run: npm ci && npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Unit tests (node)
        run: node --test tests/*.test.mjs
      - name: Tests (python)
        run: python -m unittest discover -s tests -v
